name: Release (manual)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Montar APK release
        run: ./gradlew --no-daemon :android-app:assembleRelease

      - name: Assinar (somente se os secrets existirem)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          out=android-app/build/outputs/apk/release
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Secrets de assinatura ausentes: APK NAO ASSINADO (nao instalavel sem assinar)."
            exit 0
          fi
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls "$out"/*.apk | head -1)
          "$bt/zipalign" -f -p 4 "$unsigned" "$out/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "$out/app-release-signed.apk" "$out/aligned.apk"
          rm -f "$ks" "$out/aligned.apk"

      - name: Upload APK release (artifact; sem publicar Release)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
